version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: test_results_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=test_results
    restart: unless-stopped
    networks:
      - test_results_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: test_results_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/test_results
      - MONGODB_DB_NAME=test_results
      - SECRET_KEY=dev-secret-key-change-in-production
      - BACKEND_CORS_ORIGINS=["http://localhost:3000", "http://localhost:8000"]
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - test_results_network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: test_results_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - test_results_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
    driver: local

networks:
  test_results_network:
    driver: bridge
